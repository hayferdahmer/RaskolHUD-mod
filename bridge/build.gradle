plugins {
    id "java"
}

base {
    archivesName = "raskolhud-bridge"
}

dependencies {
    implementation project(":protocol")
    compileOnly "io.papermc.paper:paper-api:${paper_api_version}"
    compileOnly "me.clip:placeholderapi:${placeholderapi_version}"
}

processResources {
    inputs.property "version", project.version
    filteringCharset = "UTF-8"

    filesMatching("plugin.yml") {
        expand(version: project.version)
    }
}

def protocolJar = project(":protocol").tasks.named("jar")

tasks.named("jar") {
    dependsOn(protocolJar)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from({
        zipTree(protocolJar.get().archiveFile.get().asFile)
    })
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = "UTF-8"
}
